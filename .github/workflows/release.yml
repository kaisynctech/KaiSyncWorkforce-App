# MAUI desktop/mobile releases are retired.
# Production client is kaisync-web (Vercel). Tag pushes no longer build APK/EXE.
#
# Optional: keep this workflow as a placeholder so existing tag automation
# does not fail noisily. Deploy web via Vercel on main.
name: Release
on:
  push:
    tags:
      - 'v*'
jobs:
  notice:
    name: Web-only release notice
    runs-on: ubuntu-latest
    steps:
      - name: Announce
        run: |
          echo "KaiSync production client is kaisync-web."
          echo "Ship web releases through Vercel (main branch / production deploy)."
          echo "MAUI Android/Windows installer pipelines have been retired."
