name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  NODE_VERSION: '22.x'
  DOTNET_VERSION: '10.0.x'
jobs:
  gate-web:
    name: Gate 1 — Web build (kaisync-web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: kaisync-web/package-lock.json
      - name: Install dependencies
        working-directory: kaisync-web
        run: npm ci
      - name: Typecheck
        working-directory: kaisync-web
        run: npx tsc --noEmit
      - name: Lint
        working-directory: kaisync-web
        run: npm run lint
      - name: Unit tests
        working-directory: kaisync-web
        run: npm test
      - name: Production build
        working-directory: kaisync-web
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  gate-dotnet-libs:
    name: Gate 2 — Shared .NET library tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Test Finance
        run: dotnet test KaiFlow.Finance.Tests/KaiFlow.Finance.Tests.csproj -c Release --logger trx
      - name: Test Payroll
        run: dotnet test KaiFlow.Payroll.Tests/KaiFlow.Payroll.Tests.csproj -c Release --logger trx
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*.trx'

  gate-migration-equivalence:
    name: Gate 3 — Migration Equivalence
    runs-on: ubuntu-latest
    needs: gate-web
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: vcivtjwreybaxgtdhtou
    steps:
      - uses: actions/checkout@v4
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Run equivalence check
        run: python3 .github/scripts/check_migration_equivalence.py

  gate-fingerprint:
    name: Gate 4 — Schema Fingerprint
    runs-on: ubuntu-latest
    needs: gate-migration-equivalence
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Install psql client
        run: sudo apt-get install -y postgresql-client
      - name: Apply local migrations to staging
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all
      - name: Compute staging fingerprint
        run: |
          psql "$SUPABASE_DB_URL" \
            -f .github/scripts/schema_fingerprint.sql \
            --no-align --tuples-only \
            > staging_fingerprint.txt
      - name: Compare against production fingerprint
        run: |
          if ! diff -u supabase/production_fingerprint.txt staging_fingerprint.txt; then
            echo "::error::Schema fingerprint mismatch — staging schema does not match production."
            exit 1
          fi
          echo "Fingerprints match."

  gate-anon-grants:
    name: Gate 5 — No New Anon Grants on SECURITY DEFINER Functions
    runs-on: ubuntu-latest
    needs: gate-migration-equivalence
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_PRODUCTION_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Install psql client
        run: sudo apt-get install -y postgresql-client
      - name: Check for anon grants
        run: |
          VIOLATIONS=$(psql "$SUPABASE_DB_URL" \
            -f .github/scripts/check_anon_grants.sql \
            --no-align --tuples-only)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::SECURITY DEFINER functions with anon grants found:"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "No violations found."
